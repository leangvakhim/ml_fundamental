<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scikit-Learn API Design Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
        }

        .code-font {
            font-family: 'Fira Code', monospace;
        }

        .fade-enter {
            opacity: 0;
            transform: translateY(10px);
        }

        .fade-enter-active {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 400ms ease-out, transform 400ms ease-out;
        }

        .pattern-bg {
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 text-slate-800">

    <!-- Main Container -->
    <div
        class="max-w-4xl w-full bg-white border border-slate-200 rounded-2xl shadow-xl overflow-hidden flex flex-col h-[750px] sm:h-[750px]">

        <!-- Header & Progress -->
        <div class="bg-slate-50 border-b border-slate-200 p-6 pb-0">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
                    <svg class="w-7 h-7 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z">
                        </path>
                    </svg>
                    Scikit-Learn API Design
                </h1>
                <span id="step-counter"
                    class="text-sm font-semibold text-blue-600 bg-blue-50 px-3 py-1 rounded-full">Step 1 of 6</span>
            </div>

            <!-- Progress Bar -->
            <div class="w-full bg-slate-200 rounded-t-lg h-2 mb-[-1px]">
                <div id="progress-bar" class="bg-blue-600 h-2 rounded-tl-lg transition-all duration-500 ease-out"
                    style="width: 16.6%;"></div>
            </div>
        </div>

        <!-- Content Area -->
        <div class="flex-1 p-6 sm:p-10 overflow-y-auto pattern-bg relative" id="content-container">
            <!-- Dynamic Content gets injected here -->
        </div>

        <!-- Footer / Navigation -->
        <div class="bg-slate-50 border-t border-slate-200 p-4 sm:px-10 flex justify-between items-center">
            <button id="btn-prev"
                class="px-5 py-2.5 rounded-lg font-medium text-slate-600 bg-white border border-slate-300 hover:bg-slate-50 hover:text-slate-900 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
                disabled>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                Back
            </button>

            <div id="dots-container" class="hidden sm:flex space-x-2">
                <!-- Dots injected via JS -->
            </div>

            <button id="btn-next"
                class="px-5 py-2.5 rounded-lg font-medium text-white bg-blue-600 hover:bg-blue-700 shadow-sm transition-colors flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                Next Step
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>
        </div>
    </div>

    <script src="../js/scikit_learn_api_design.js"></script>
</body>

</html>
